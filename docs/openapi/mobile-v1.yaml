openapi: 3.1.0
info:
  title: Trimly Mobile API
  version: 1.0.0
  description: Hardened REST API for Trimly native mobile clients (iOS & Android).
servers:
  - url: https://api.trimly.app/api/mobile/v1
    description: Production Server
  - url: http://localhost:3000/api/mobile/v1
    description: Local Development Server

paths:
  /config:
    get:
      summary: Get mobile client configuration & feature flags
      operationId: getConfig
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'

  /auth/register:
    post:
      summary: Register a new customer or barber account
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration initiated
        '400':
          $ref: '#/components/responses/ErrorResponse'

  /auth/login:
    post:
      summary: Authenticate with email & password to obtain Bearer tokens
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful authentication
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/refresh:
    post:
      summary: Rotate refresh token to obtain a new access and refresh token
      operationId: refreshSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                deviceId:
                  type: string
      responses:
        '200':
          description: Tokens rotated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'

  /auth/logout:
    post:
      summary: Revoke current session
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Session revoked

  /auth/logout-all:
    post:
      summary: Revoke all mobile sessions for current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: All sessions revoked

  /auth/sessions:
    get:
      summary: List active mobile sessions for current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of active sessions

  /auth/sessions/{id}:
    delete:
      summary: Revoke a specific session
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session revoked

  /auth/google:
    post:
      summary: Server-verified Google native sign-in
      operationId: googleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                deviceId:
                  type: string
                platform:
                  type: string
                  enum: [ios, android, unknown]
      responses:
        '200':
          $ref: '#/components/schemas/AuthTokenResponse'

  /auth/apple:
    post:
      summary: Server-verified Apple native sign-in
      operationId: appleLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                rawNonce:
                  type: string
                fullName:
                  type: string
                deviceId:
                  type: string
                platform:
                  type: string
                  enum: [ios, android, unknown]
      responses:
        '200':
          $ref: '#/components/schemas/AuthTokenResponse'

  /barbers:
    get:
      summary: List, search and geolocate barbers
      operationId: getBarbers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: lat
          in: query
          schema:
            type: number
        - name: lng
          in: query
          schema:
            type: number
        - name: radiusKm
          in: query
          schema:
            type: number
        - name: sort
          in: query
          schema:
            type: string
            enum: [rating, waiting_time, name]
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: Barbers list
        '304':
          description: Not Modified (ETag matched)

  /barbers/{id}:
    get:
      summary: Get barber details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Barber details
        '404':
          $ref: '#/components/responses/ErrorResponse'

  /barbers/{id}/availability:
    get:
      summary: Get available appointment time slots
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: serviceId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Available slots

  /barber/profile:
    get:
      summary: Get barber self profile (barber role)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Barber profile
    put:
      summary: Update barber profile and services
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Barber updated

  /bookings:
    get:
      summary: List user or barber bookings
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: List of bookings
    post:
      summary: Create appointment booking with Idempotency-Key support
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
      responses:
        '201':
          description: Booking created
        '409':
          description: Conflict (SLOT_TAKEN / USER_CONFLICT)
        '422':
          description: Idempotency key payload mismatch

  /bookings/{id}:
    get:
      summary: Get booking details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Booking detail
    patch:
      summary: Transition booking status (cancel, reschedule, confirm, decline, complete, no-show)
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingUpdateRequest'
      responses:
        '200':
          description: Booking status updated

  /reviews:
    get:
      summary: List reviews for a barber
      parameters:
        - name: barberId
          in: query
          required: true
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Reviews list
    post:
      summary: Submit a review for a completed appointment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewCreateRequest'
      responses:
        '201':
          description: Review created

  /notifications:
    get:
      summary: List notifications with unread count
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Notifications list
    patch:
      summary: Mark notification(s) as read
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications marked read

  /users/profile:
    get:
      summary: Get current authenticated user profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
    patch:
      summary: Update profile name and phone
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile updated

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ConfigResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            minSupportedAppVersion:
              type: object
              properties:
                ios: { type: string }
                android: { type: string }
            latestVersion:
              type: object
              properties:
                ios: { type: string }
                android: { type: string }
            maintenance: { type: boolean }
            featureFlags: { type: object }
            legalUrls: { type: object }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        deviceId: { type: string }
        platform: { type: string, enum: [ios, android, unknown] }
        appVersion: { type: string }

    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        role: { type: string, enum: [user, barber] }

    AuthTokenResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accessToken: { type: string }
            refreshToken: { type: string }
            expiresIn: { type: integer }
            user:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                email: { type: string }
                role: { type: string }

    BookingCreateRequest:
      type: object
      required: [barberId, service, timeSlot]
      properties:
        barberId: { type: string }
        service: { type: string }
        serviceId: { type: string }
        timeSlot: { type: string, format: date-time }

    BookingUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled, declined, no_show]
        cancelReason: { type: string }
        timeSlot: { type: string, format: date-time }

    ReviewCreateRequest:
      type: object
      required: [barberId, bookingId, rating]
      properties:
        barberId: { type: string }
        bookingId: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 1000 }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            requestId: { type: string }

  responses:
    ErrorResponse:
      description: Error envelope response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
